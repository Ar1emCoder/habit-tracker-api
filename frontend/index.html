<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HabitTracker | Артём</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="sidebar-top">
                <div class="logo">
                    <div class="logo-mark"><svg><use href="#i-flame"/></svg></div>
                    <span class="logo-text">HabitTracker</span>
                </div>
                <div class="search-box">
                    <svg class="search-icon"><use href="#i-search"/></svg>
                    <input type="text" id="search-input" placeholder="Поиск...">
                </div>
                <div class="nav-group">
                    <div class="nav-group-title">Планы</div>
                    <button class="nav-item active" data-view="today"><svg><use href="#i-sun"/></svg><span>Сегодня</span><span class="nav-count" id="nav-count-today"></span></button>
                    <button class="nav-item" data-view="tomorrow"><svg><use href="#i-sun"/></svg><span>Завтра</span><span class="nav-count" id="nav-count-tomorrow"></span></button>
                    <button class="nav-item" data-view="week"><svg><use href="#i-calendar"/></svg><span>Следующие 7 дней</span><span class="nav-count" id="nav-count-week"></span></button>
                    <button class="nav-item" data-view="inbox"><svg><use href="#i-inbox"/></svg><span>Входящие</span><span class="nav-count" id="nav-count-inbox"></span></button>
                </div>
                <div class="nav-group">
                    <div class="nav-group-title">Привычки и аналитика</div>
                    <button class="nav-item" data-view="habits"><svg><use href="#i-flame"/></svg><span>Привычки</span></button>
                    <button class="nav-item" data-view="matrix"><svg><use href="#i-grid"/></svg><span>Матрица Эйзенхауэра</span></button>
                    <button class="nav-item" data-view="stats"><svg><use href="#i-chart"/></svg><span>Статистика</span></button>
                </div>
            </div>
            <div class="sidebar-bottom">
                <div class="api-status" id="api-status"><span class="dot"></span><span>Проверка...</span></div>
                <div class="user-area" id="user-area">
                    <button class="btn btn-primary" id="login-btn"><svg><use href="#i-user"/></svg>Войти</button>
                </div>
                <button class="theme-btn" id="theme-btn"><svg><use href="#i-moon"/></svg><span id="theme-label">Тёмная тема</span></button>
            </div>
            <div class="sidebar-footer" style="border-top: 1px solid var(--border); padding: 12px; margin-top: auto; font-size: 11px; color: var(--text-3); text-align: center;">
                Создано Артёмом<br>2026
            </div>
        </aside>
        <main class="main">
            <header class="main-header">
                <div><h1 id="view-title">Сегодня</h1><div class="view-date" id="view-date"></div></div>
                <button class="btn btn-primary" id="header-add-btn"><svg><use href="#i-plus"/></svg>Добавить задачу</button>
            </header>
            <div class="content" id="content"></div>
        </main>
    </div>

    <div class="modal-overlay hidden" id="task-modal">
        <div class="modal">
            <div class="modal-head"><h2 id="task-modal-title">Новая задача</h2><button class="modal-close" data-close="task-modal"><svg><use href="#i-x"/></svg></button></div>
            <div class="modal-body">
                <label>Название<input type="text" id="task-title" placeholder="Например: Подготовить презентацию"></label>
                <label>Дата<input type="date" id="task-date"></label>
                <div class="auth-hint" id="auth-hint" aria-live="polite"></div>
                <div class="task-flags-row">
                    <button class="flag-toggle" id="flag-important"><svg><use href="#i-star"/></svg>Важно</button>
                    <button class="flag-toggle" id="flag-urgent"><svg><use href="#i-flash"/></svg>Срочно</button>
                </div>
            </div>
            <div class="modal-actions"><button class="btn" data-close="task-modal">Отмена</button><button class="btn btn-primary" id="task-save">Сохранить</button></div>
        </div>
    </div>

    <div class="modal-overlay hidden" id="auth-modal">
        <div class="modal modal-sm">
            <div class="modal-head"><h2 id="auth-title">Вход</h2><button class="modal-close" data-close="auth-modal"><svg><use href="#i-x"/></svg></button></div>
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">Вход</button>
                <button class="auth-tab" data-tab="register">Регистрация</button>
            </div>
            <div class="modal-body">
                <label>Имя пользователя<input type="text" id="auth-username" placeholder="artem"></label>
                <label>Пароль<input type="password" id="auth-password" placeholder="••••••••"></label>
                <div class="auth-error" id="auth-error"></div>
            </div>
            <div class="modal-actions"><button class="btn" data-close="auth-modal">Отмена</button><button class="btn btn-primary" id="auth-submit">Войти</button></div>
        </div>
    </div>

    <div class="modal-overlay hidden" id="confirm-modal">
        <div class="modal modal-sm">
            <div class="modal-head"><h2>Подтверждение</h2><button class="modal-close" data-close="confirm-modal"><svg><use href="#i-x"/></svg></button></div>
            <div class="modal-body"><p id="confirm-text"></p></div>
            <div class="modal-actions"><button class="btn" data-close="confirm-modal">Отмена</button><button class="btn btn-danger" id="confirm-ok">Удалить</button></div>
        </div>
    </div>

    <div class="toasts" id="toasts"></div>

        <symbol id="i-calendar" viewBox="0 0 24 24"><path fill="currentColor" d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></symbol>

        <symbol id="i-user" viewBox="0 0 24 24"><path fill="currentColor" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></symbol>

    <script src="/static/app.js"></script>
</body>
</html>
